server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No reverse proxy to the backend here: Aiven Runtime doesn't support
    # internal networking between two app containers, so the frontend calls
    # the backend's public URL directly (see src/api/client.ts + env.js /
    # docker-entrypoint.sh) rather than through this nginx.
    location /env.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri /index.html;
    }
}
