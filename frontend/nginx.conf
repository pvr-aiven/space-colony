server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxied as-is (no trailing slash on proxy_pass) so /api/... reaches the
    # backend with the same path — matches its Fastify routes, which already
    # include the /api prefix themselves.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://backend:3000;
    }

    location / {
        try_files $uri /index.html;
    }
}
