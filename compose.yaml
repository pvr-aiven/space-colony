# Manifest for Aiven Runtime. Application services (backend, frontend)
# specify a `build` context and get built from their Dockerfile; the data
# service specifies a standard `image` tag instead — Aiven Runtime
# recognizes it and offers to either provision a new managed service or
# link an existing one (space-colony-pg) via the swap-to-existing icon in
# the console's composer view. No Terraform involved either way.
#
# Aiven Runtime does NOT support internal networking between two app
# containers, so frontend -> backend is wired via a public URL in an
# env var (API_URL), not container-to-container DNS. See the root
# README's "Deploying to Aiven" section for the exact steps: deploy
# backend first, note its URL, set API_URL on frontend, then deploy it.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - space-colony-pg
    # Matches the placeholder creds on space-colony-pg below — lets `docker
    # compose up` work standalone. Aiven Runtime overwrites these with the
    # real values once you connect the actual space-colony-pg service in
    # the console, regardless of what's set here.
    environment:
      - PGHOST=space-colony-pg
      - PGPORT=5432
      - PGUSER=app_runtime
      - PGPASSWORD=placeholder
      - PGDATABASE=space_colony

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - backend
    # Read by the browser directly — this is the backend's PUBLIC URL, not
    # an internal service name. http://localhost:3000 is only correct for
    # this local `docker compose up` (the browser runs on the host and hits
    # the host-mapped port); on Aiven Runtime, set this to the backend
    # app's actual deployed URL instead.
    environment:
      - API_URL=http://localhost:3000

  # Placeholder credentials below only matter if Aiven provisions a brand
  # new service from this definition. Swap to the existing space-colony-pg
  # service in the console instead, and the real credentials get injected
  # into `backend` automatically.
  space-colony-pg:
    image: postgres:18
    environment:
      POSTGRES_DB: space_colony
      POSTGRES_USER: app_runtime
      POSTGRES_PASSWORD: placeholder
